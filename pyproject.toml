[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devmesh-gateway"
version = "0.1.0"
description = "DevMesh LLM Gateway - AI control plane for inference runtimes"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "DevMesh Services"}
]
dependencies = [
    "fastapi>=0.124.0",
    "uvicorn[standard]>=0.38.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.9.0",
    "pyyaml>=6.0.1",
    "httpx>=0.28.0",
    "prometheus-client>=0.23.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    # Schema migrations, run at startup (D-047)
    "alembic>=1.13.0",
    # Multipart uploads (audio transcription). FastAPI needs it for any form route
    "python-multipart>=0.0.18",
]

[project.scripts]
# Migrate the configured database (GATEWAY_DB_URL) and exit (D-047)
gateway-migrate = "gateway.storage.migrate:main"

[project.optional-dependencies]
# Shared rate limits and concurrency slots across gateway processes (D-035).
# Only needed when GATEWAY_REDIS_URL is set.
redis = ["redis>=5.0,<7"]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.14.0",
    "mypy>=1.19.0",
    "types-PyYAML>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"gateway.storage.migrations" = ["script.py.mako", "README"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic-generated revisions keep alembic's own style
extend-exclude = ["src/gateway/storage/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    "N818",   # Exception names don't need Error suffix (PolicyViolation, RateLimitExceeded, etc.)
    "E501",   # Line length handled by formatter; remaining are string literals
    "UP042",  # (str, Enum) -> StrEnum changes str()/format() output of members
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]       # Module-level imports in test fixtures
"src/gateway/providers/*" = ["E402"]  # Import order after logger init

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
