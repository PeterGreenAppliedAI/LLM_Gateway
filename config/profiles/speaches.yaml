# speaches (formerly faster-whisper-server). Verified from source 2026-10-07.
# Serves both speech-to-text (faster-whisper) and text-to-speech (Kokoro, Piper).
description: speaches — faster-whisper speech-to-text plus Kokoro/Piper text-to-speech
tts:
  voices_path: /v1/audio/voices   # objects with name, language, gender
  params:
    # Kokoro models allow 0.5-2.0 and Piper 0.25-4.0; widest range here
    speed: {type: number, min: 0.25, max: 4.0, default: 1.0}
    response_format: {type: enum, values: [pcm, mp3, wav, flac, opus, aac], default: mp3}
    stream_format: {type: enum, values: [audio, sse], default: audio}
    sample_rate: {type: integer, min: 8000, max: 48000}
stt:
  # Whisper language codes; omit `language` to auto-detect
  languages: [en, zh, de, es, ru, ko, fr, ja, pt, tr, pl, ca, nl, ar, sv, it, id, hi, fi, vi,
              he, uk, el, ms, cs, ro, da, hu, ta, "no", th, ur, hr, bg, lt, la, mi, ml, cy, sk,
              te, fa, lv, bn, sr, az, sl, kn, et, mk, br, eu, is, hy, ne, mn, bs, kk, sq, sw,
              gl, mr, pa, si, km, sn, yo, so, af, oc, ka, be, tg, sd, gu, am, yi, lo, uz, fo,
              ht, ps, tk, nn, mt, sa, lb, my, bo, tl, mg, as, tt, haw, ln, ha, ba, jw, su, yue]
  params:
    response_format: {type: enum, values: [text, json, verbose_json, srt, vtt], default: json}
    temperature: {type: number, min: 0, max: 1, default: 0}
