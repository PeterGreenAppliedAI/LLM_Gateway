version: "3.8"

services:
  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GATEWAY_LOG_LEVEL=INFO
      - GATEWAY_CONFIG_PATH=/app/config/gateway.yaml
      - GATEWAY_PROVIDERS_CONFIG_PATH=/app/config/providers.yaml
      # Operator credential for the dashboard and management APIs (D-042).
      # Required: behind the dashboard's proxy nothing counts as local.
      - GATEWAY_ADMIN_API_KEY=${GATEWAY_ADMIN_API_KEY:?Set GATEWAY_ADMIN_API_KEY (operator key for the dashboard)}
      # Optional shared state (D-035): set to redis://redis:6379/0 and start
      # with `--profile ha` to share rate limits and slots across replicas
      - GATEWAY_REDIS_URL=${GATEWAY_REDIS_URL:-}
    volumes:
      - ./config:/app/config:ro
      # Database, audit intent log, budgets, keys (D-044): survives
      # container replacement and upgrades
      - gateway-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - gateway-network

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
      # Same-origin API: nginx in the image proxies /api, /v1, /health and
      # /metrics to the gateway, so the dashboard works from any browser
      # (a Docker-internal URL like http://gateway:8000 never resolved there)
      args:
        VITE_API_URL: ""
    ports:
      - "5174:5174"
    restart: unless-stopped
    networks:
      - gateway-network
    depends_on:
      - gateway

  # Optional: shared rate limits and concurrency slots for several gateway
  # processes. Not started by default; nothing else depends on it.
  #   GATEWAY_REDIS_URL=redis://redis:6379/0 docker compose --profile ha up -d
  # No persistence needed: it only holds short-lived counts and leases.
  redis:
    image: redis:7-alpine
    profiles: ["ha"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    networks:
      - gateway-network

  prometheus:
    image: prom/prometheus:v2.47.0
    ports:
      # Loopback only: Prometheus has no auth of its own
      - "127.0.0.1:9090:9090"
    volumes:
      - ./config/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    restart: unless-stopped
    networks:
      - gateway-network

  grafana:
    image: grafana/grafana:10.2.0
    ports:
      # Loopback only: expose deliberately (reverse proxy + real creds) if needed
      - "127.0.0.1:3000:3000"
    environment:
      # No default: set GRAFANA_ADMIN_PASSWORD in .env (compose refuses to start without it)
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - gateway-network
    depends_on:
      - prometheus

networks:
  gateway-network:
    driver: bridge

volumes:
  gateway-data:
  prometheus-data:
  grafana-data:
