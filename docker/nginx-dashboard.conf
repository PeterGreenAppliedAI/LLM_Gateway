# Dashboard + same-origin API proxy (D-044). The browser talks only to this
# server; API paths go to the gateway on the Compose network, so the
# dashboard works from any machine without CORS or a Docker-internal URL.
server {
    listen 5174;
    root /usr/share/nginx/html;

    location ~ ^/(api|v1|health|metrics)(/|$) {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Streams (SSE/NDJSON) must reach the browser as they're produced
        proxy_buffering off;
        proxy_read_timeout 3600s;
        client_max_body_size 30m;
    }

    location / {
        try_files $uri /index.html;
    }
}
